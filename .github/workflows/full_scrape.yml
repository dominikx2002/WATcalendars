name: Daily Full Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      faculties:
        description: 'Faculty codes (space separated) or "all"'
        default: 'all'
      semester:
        description: 'Override semester (zima/lato), blank = auto'
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        run: playwright install --with-deps firefox chromium

      - name: Prepare logs
        run: |
          mkdir -p logs
          find logs -name "*.txt" -type f -mtime +14 -delete
          echo "LOG_PATH=logs/scrape_$(date +'%Y-%m-%d_%H-%M').txt" >> $GITHUB_ENV

      # One command per stage instead of 17 hand-listed steps. A faculty
      # that fails is reported and the others still run, because the CLI
      # isolates each one; the exit code still turns the run red.
      - name: Scrape employees
        continue-on-error: true
        run: watcal --verbose --log-file "$LOG_PATH" employees

      - name: Discover groups
        continue-on-error: true
        run: >
          watcal --verbose --log-file "$LOG_PATH"
          ${{ github.event.inputs.semester && format('--semester {0}', github.event.inputs.semester) || '' }}
          groups ${{ github.event.inputs.faculties || 'all' }}

      - name: Build calendars
        id: calendars
        run: >
          watcal --verbose --log-file "$LOG_PATH"
          ${{ github.event.inputs.semester && format('--semester {0}', github.event.inputs.semester) || '' }}
          calendars ${{ github.event.inputs.faculties || 'all' }}

      # Authoritative status: the CLI already wrote one, but only CI knows
      # whether the earlier stages (employees, groups) failed too, and
      # only CI has the run URL to link to.
      - name: Record run status
        if: always()
        run: |
          python - <<'PY'
          import json, os, datetime
          ok = "${{ job.status }}" == "success"
          json.dump({
              "conclusion": "success" if ok else "failure",
              "finished": datetime.datetime.now(datetime.timezone.utc)
                          .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "detail": "${{ job.status }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          }, open("db/calendars/status.json", "w"), separators=(",", ":"))
          PY

      - name: Commit results
        if: always()
        run: |
          git config user.name 'Github Actions Bot'
          git config user.email 'actions@github.com'
          # index.json is what the website reads; it is rebuilt by the
          # calendars stage, so it must ship with the .ics files.
          git add db/employees.json db/groups_url db/calendars logs
          git commit -m "Automated daily scrape" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: ${{ env.LOG_PATH }}
          retention-days: 14
