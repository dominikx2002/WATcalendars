name: Probe e-dziekanat
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reach e-dziekanat from a GitHub runner
        run: |
          URL="https://s1.wcy.wat.edu.pl/ed1/"
          echo "== runner public IP =="
          curl -sS -m 10 https://api.ipify.org; echo
          echo "== HEAD $URL =="
          curl -sS -I -m 25 "$URL" || echo "HEAD failed: exit $?"
          echo "== GET $URL =="
          code=$(curl -sS -m 25 -o body.html -w "%{http_code}" "$URL") || echo "GET failed: exit $?"
          echo "HTTP status: $code"
          echo "bytes: $(wc -c < body.html 2>/dev/null || echo 0)"
          if grep -qi "incapsula" body.html 2>/dev/null; then
            echo ">>> INCAPSULA block page"
          else
            echo ">>> no Incapsula marker"
          fi
          echo "== first 300 bytes =="
          head -c 300 body.html 2>/dev/null; echo
