[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WATcalendars"
version = "0.4.0"
description = "WAT university calendar scraper for multiple faculties"
authors = [
    {name = "Dominik Serafin", email = "serafin652002@gmail.com"}
]
maintainers = [
    {name = "Dominik Serafin", email = "serafin652002@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Students",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "scraping", "calendar", "education", "university", "wat", 
    "ics", "playwright", "beautifulsoup"
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "python-docx>=1.1.2",
    "requests>=2.31.0",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/dominikserafin/WATcalendars"
Repository = "https://github.com/dominikserafin/WATcalendars"
Issues = "https://github.com/dominikserafin/WATcalendars/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
# One entry point for everything. Previously there were 17, and the
# eight group scrapers among them were broken: pyproject pointed at a
# `main` function those modules never defined.
#
#   watcal list                 what is configured
#   watcal groups all           discover groups for every faculty
#   watcal calendars wcy wim    build .ics for selected faculties
#   watcal run all              groups + calendars
#   watcal employees            refresh the USOSweb staff list
watcal = "watcalendars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
